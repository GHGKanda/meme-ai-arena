name: Arena Modelltest
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
concurrency:
  group: arena-benchmark
  cancel-in-progress: false
jobs:
  historical-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Numerischer Softwaretest
        run: python arena.py --test --out /tmp/arena-test
      - name: Historischer Modelltest
        id: benchmark
        continue-on-error: true
        run: |
          if [ -f history.csv ]; then python arena.py --csv history.csv; else python arena.py; fi
      - name: Lernstand speichern
        if: always()
        run: |
          mkdir -p results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m 'Update historical model test report'
            git push
          fi
      - name: Fehler sichtbar machen
        if: steps.benchmark.outcome == 'failure'
        run: exit 1
